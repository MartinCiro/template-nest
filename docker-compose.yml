services:
  go_backend:
    build: .
    container_name: go_backend
    restart: always
    depends_on:
      - redis
      - postgres
    expose: 
      - "8080"
    environment:
      - HOST_DB=postgres
      - PORT_DB=5432
      - USER_DB=${USER_DB:-postgres}
      - PASS_DB=${PASS_DB:-password}
      - NAME_DB=${NAME_DB:-myapp}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRETO=${JWT_SECRETO}
      - JWT_SALT=${JWT_SALT:-10}
      - ENV=${ENV:-Production}
      - PORT=8080
    networks:
      - app_internal
      - proxy_net

  redis:
    image: redis:latest
    container_name: redis_service-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"] 
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - app_internal
    expose: 
      - "6379"
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD
      else
        redis-server
      fi"
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres-service-1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      POSTGRES_USER: ${USER_DB:-postgres}
      POSTGRES_PASSWORD: ${PASS_DB:-password}
      POSTGRES_DB: ${NAME_DB:-myapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal
    expose: 
      - "5432"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  proxy_net:
    external: true

  app_internal:
    driver: bridge